<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product — MiniShop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/product.css">
</head>
<body>

<header class="navbar">
  <div class="container">
    <h2 class="brand">MiniShop</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<main>
  <div class="container product-page">
    <div class="product-layout">
      <div class="product-media">
        <img id="product-image" src="https://via.placeholder.com/600x400?text=No+Image" alt="" />
      </div>

      <div class="product-details">
        <h1 id="product-name">Loading…</h1>
        <p id="product-description" class="desc"></p>
        <p class="price" id="product-price"></p>

        <div class="meta kv">
          <span>Stock: <strong id="product-stock">—</strong></span>
        </div>

        <div class="actions">
          <label class="qty-label">Quantity
            <input id="qty" type="number" value="1" min="1" />
          </label>
          <button id="add-to-cart" class="btn">Add to Cart</button>
        </div>

        <div id="product-msg" class="kv" aria-live="polite"></div>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>© MiniShop — Simple e-commerce demo</p>
  </div>
</footer>

<script src="js/nav.js"></script>
<script src="js/product.js"></script>
</body>
</html>
