<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cart — MiniShop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
<header class="navbar">
  <div class="container">
    <h2 class="brand">MiniShop</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="login.html">Login</a>
    </nav>
  </div>
</header>

<main>
  <div class="container cart-page">
    <h1>Your Cart</h1>

    <div id="cart-empty" class="kv">Your cart is empty.</div>

    <div class="cart-grid" id="cart-grid" style="display:none">
      <div class="cart-items" id="cart-items"></div>

      <aside class="cart-summary">
        <div class="summary-card">
          <h3>Order Summary</h3>
          <div class="summary-row"><span>Items:</span><span id="summary-count">0</span></div>
          <div class="summary-row"><span>Subtotal:</span><span id="summary-sub">Rs 0.00</span></div>
          <div class="summary-row"><span>Shipping:</span><span id="summary-ship">Rs 0.00</span></div>
          <div class="summary-row total"><span>Total:</span><span id="summary-total">Rs 0.00</span></div>
          <button id="checkout-btn" class="btn">Proceed to Checkout</button>
          <button id="clear-btn" class="btn ghost">Clear Cart</button>
        </div>
      </aside>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <p>© MiniShop — Simple e-commerce demo</p>
  </div>
</footer>

<script src="js/nav.js"></script>
<script src="js/cart.js"></script>
</body>
</html>
